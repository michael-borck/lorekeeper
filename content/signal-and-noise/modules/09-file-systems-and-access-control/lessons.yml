# Lorekeeper overlay for the enterprise systems course, Module 09.

lessons:
  - id: 09-01
    kind: reading
    title: File systems and access control
    source: overview.qmd
    include:
      - Learning objectives
      - The week's idea
      - Key ideas
      - The CloudCore ticket

  - id: 09-02
    kind: reading
    title: Read the share and fix it
    source: in-class/activity-01.qmd
    include:
      - "Part 1: Observe the failure"
      - "Part 2: Fix it"
      - "Part 3: Explain the fix"

  - id: 09-03
    kind: checkpoint
    title: "Checkpoint: permissions and ownership"
    questions:
      - id: q1
        prompt: What does the inode store?
        options:
          - Metadata such as type, owner, group, mode and data pointers
          - Only the file name
          - The user's password
          - The network route
        answer: 0
        explanation: The name lives in the directory entry. The inode holds the metadata and the data location.
      - id: q2
        prompt: What does execute permission mean on a directory?
        options:
          - It allows traversal through the directory
          - It lists the names in the directory
          - It deletes the directory
          - It changes the owner
        answer: 0
        explanation: Read lists names, write creates and deletes entries, execute allows you to pass through.
      - id: q3
        prompt: What does the mode 2770 mean for the group?
        options:
          - Read, write and execute, with setgid on the directory
          - Read only
          - No access
          - Write only
        answer: 0
        explanation: The 7 gives the group rwx. The leading 2 sets the setgid bit so new files inherit the directory group.
      - id: q4
        prompt: Why is `chmod 777 /share` the wrong fix?
        options:
          - It gives every account write access and removes the control
          - It changes the group owner
          - It deletes the report
          - It is slower than chown
        answer: 0
        explanation: The service needs write access, not everyone. Fix ownership and group write, not the world.
      - id: q5
        prompt: What is the smallest safe fix for a writer whose UID needs to write to a group-owned share?
        options:
          - Put the writer in the share group and give the group write permission
          - Change the file to world-writable
          - Run the writer as root
          - Delete the share
        answer: 0
        explanation: The group model grants only the needed access and keeps other accounts out.
      - id: q6
        prompt: A second service with a different UID must also write to the share. What should you do?
        options:
          - Add it to the share group, or use a reviewed ACL for that named identity
          - Give it root
          - Make the share world-writable
          - Copy the file to another host
        answer: 0
        explanation: Extend the existing group model, or use an ACL with a clear owner and review path.

  - id: 09-04
    kind: fill
    title: Read the mode
    prompt: |
      Complete the permission explanation.
    passage: |
      The mode 2770 means: the owner has rwx, the group has [[1]], and others have [[2]].

      The leading 2 is the [[3]] bit.

      chmod 777 is dangerous because it gives [[4]] write access.
    blanks:
      - answers: [rwx, "read, write and execute", "read write execute"]
        hint: The group needs to read, write and traverse.
      - answers: [none, "no access", "---"]
        hint: Other accounts should not reach the share.
      - answers: [setgid, "set group id"]
        hint: New files inherit the directory group.
      - answers: [others, everyone, "other users", "all users"]
        hint: The last permission set is the one to avoid opening.
