# The manifest and service worker are text exercises: parsed and pattern-checked.

lessons:
  - id: 10-01
    kind: reading
    title: Pocket-sized
    source: overview.qmd
    include:
      - The question
      - Learning objectives
      - This module
      - The lab deliverable

  - id: 10-02
    kind: reading
    title: Manifest, worker, offline
    source: in-class/activity-01.qmd
    include:
      - The situation
      - "Round 2: Manifest (30 minutes)"
