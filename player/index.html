<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorekeeper · field notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="Course outline">
      <a class="brand" href="./" id="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-text">Lorekeeper<span class="brand-sub">field notes</span></span>
      </a>
      <div id="course-meta" class="course-meta"></div>
      <nav id="outline" class="outline"></nav>
      <div class="sidebar-footer">
        <div class="xp-row"><span>XP</span><strong id="xp">0</strong></div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <label class="theme-picker" for="theme-select">
          <span>Skin</span>
          <select id="theme-select" aria-label="Skin">
            <option value="ink">Ink</option>
            <option value="pixel">Pixel</option>
            <option value="storybook">Storybook</option>
          </select>
        </label>
        <button id="badges-button" class="ghost small" type="button">Achievements <span id="badge-count">0</span></button>
        <button id="reset-progress" class="ghost small" type="button">Reset progress</button>
      </div>
    </aside>

    <main id="main" class="main">
      <div id="content" class="content">
        <div class="placeholder">
          <h1>Lorekeeper</h1>
          <p>Opening the course index...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="badge-dialog" class="badge-dialog" aria-labelledby="badge-title">
    <div class="badge-head">
      <div>
        <h2 id="badge-title">Achievements</h2>
        <p id="badge-summary" class="badge-summary"></p>
      </div>
      <button id="badges-close" class="ghost small" type="button">Close</button>
    </div>
    <div id="badge-list" class="badge-list"></div>
  </dialog>

  <script src="widgets.js"></script>
  <script src="badges.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
