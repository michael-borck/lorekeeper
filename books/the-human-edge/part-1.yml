# Interactive lessons appended to Part 1 of The Human Edge.
lessons:
  - kind: checkpoint
    title: "Checkpoint: place the output"
    questions:
      - id: q1
        prompt: What two questions does the Trust Tool ask?
        options:
          - How exact must it be, and what happens if it is wrong
          - How long is it, and who wrote it
          - Is it generated by AI, and is it free
          - How new is the model, and how fast is it
        answer: 0
        explanation: "Precision runs across. Consequences run up. The corner sets the check."
      - id: q2
        prompt: A birthday message for a colleague belongs in which corner?
        options:
          - A, average is fine and the consequence is small
          - B, average is fine but the consequence is large
          - C, precise and the consequence is small
          - D, precise and the consequence is large
        answer: 0
        explanation: "A mistake is cheap and the ballpark is fine. Do not spend twenty minutes verifying a birthday message."
      - id: q3
        prompt: A publication year in an internal newsletter belongs in which corner?
        options:
          - C, precise and the consequence is small
          - A, average and small
          - B, average and large
          - D, precise and large
        answer: 0
        explanation: "There is one right answer, and a wrong year in print creates a correction. Internal does not mean invisible."
      - id: q4
        prompt: What counts as checking an AI output?
        options:
          - Checking the source, the data, your own arithmetic or a colleague who knows
          - Asking the AI if it is sure
          - Starting a fresh chat and asking again
          - Reading it twice
        answer: 0
        explanation: "The check comes from outside the tool. The tool tends to agree with itself."
      - id: q5
        prompt: When should you lean in and use the output with light review?
        options:
          - When average is fine and the consequence of being wrong is small
          - When the output is long and polished
          - When the model is the newest one
          - When a senior person will read it later
        answer: 0
        explanation: "Spend verification effort where precision and consequences meet. Light review belongs in the low-stakes corner."
      - id: q6
        prompt: What is Gell-Mann amnesia in this context?
        options:
          - Trusting output outside your field while doubting it inside your field, which is backwards
          - Forgetting a model's name
          - Trusting every citation
          - Refusing to use AI at all
        answer: 0
        explanation: "Your expertise is a checking instrument. Where you lack it, you need more outside verification, not less."
      - id: q7
        prompt: What should you do before pasting material into an AI tool?
        options:
          - Classify it, remove identifying details and know what the tool remembers
          - Paste it and delete it later
          - Ask the tool to keep it secret
          - Use a personal account
        answer: 0
        explanation: "Placement protects what comes out. Classification protects what goes in."
