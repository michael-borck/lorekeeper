# Interactive lessons appended to Part 4 of Conversation, Not Delegation.
lessons:
  - kind: checkpoint
    title: "Checkpoint: putting it together"
    questions:
      - id: q1
        prompt: What should you separate in an agentic loop?
        options:
          - The loop that proposes actions from the authority that permits them
          - The model from the keyboard
          - The prompt from the output
          - The budget from the goal
        answer: 0
        explanation: "Drafting and sending are different systems, even when the text is identical."
      - id: q2
        prompt: Where must the test for an automated loop sit?
        options:
          - Outside the proposed answer, in an independent check or evaluator
          - Inside the same model that produced the answer
          - In the model's explanation of its own work
          - In the final prose
        answer: 0
        explanation: "A model checking itself shares its blind spots. The test, data and reviewer need to be independent."
      - id: q3
        prompt: What belongs in a bounded loop specification?
        options:
          - Goal, inputs, permissions, evaluation, budget, review gate and stop or recovery
          - Only the goal and the model name
          - The prompt and the output
          - The fee and the deadline
        answer: 0
        explanation: "A keep-going-until-done instruction is not a plan. Boundaries make the loop inspectable."
      - id: q4
        prompt: What can a word-count check miss?
        options:
          - Whether a contractual qualification or capacity definition was removed
          - Whether the text is shorter
          - Whether the loop ran
          - Whether the model produced text
        answer: 0
        explanation: "A loop can satisfy the metric while making the document less useful. The measure is not the purpose."
      - id: q5
        prompt: What should you compare when reviewing your own practice?
        options:
          - Your first attempt, the AI-assisted result, and what each one missed
          - The number of prompts used
          - The model's confidence score
          - The length of the final answer
        answer: 0
        explanation: "Where the tool beats you is a blind spot. Where you beat it is a limit to check."
      - id: q6
        prompt: What is the owned result?
        options:
          - Work whose important claims you can check and whose decisions you can explain
          - Text that sounds human
          - An answer produced without AI
          - A result approved by the model
        answer: 0
        explanation: "Ownership is explanation and evidence, not prose style or tool avoidance."
      - id: q7
        prompt: What remains yours as the loop becomes more capable?
        options:
          - Specifying the task, inspecting the evidence, noticing a failed assumption and accounting for the decision
          - Typing every token
          - Avoiding all automation
          - Trusting the model's explanation
        answer: 0
        explanation: "A loop can accelerate parts of the work without making those questions unnecessary."
