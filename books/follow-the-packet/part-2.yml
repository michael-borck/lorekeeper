# Interactive lessons appended to Part 2 of Follow the Packet.
lessons:
  - kind: checkpoint
    title: "Checkpoint: change the network"
    questions:
      - id: q1
        prompt: In nftables, what decides which rule applies to a packet?
        options:
          - The first matching rule in the chain
          - The last matching rule
          - The most specific rule automatically
          - The rule with the highest priority number
        answer: 0
        explanation: "Order matters. A broad accept near the top can shadow every later drop."
      - id: q2
        prompt: What is the default policy?
        options:
          - The action when no rule matches, such as drop
          - The first rule in the chain
          - The firewall's brand
          - The logging level
        answer: 0
        explanation: "A default accept is a decision. It should be deliberate, not accidental."
      - id: q3
        prompt: What does a Suricata alert prove?
        options:
          - A rule matched traffic, not that an incident occurred
          - That an attack succeeded
          - That the firewall failed
          - That the host is compromised
        answer: 0
        explanation: "The alert is a lead. The packet evidence and the investigation decide."
      - id: q4
        prompt: Why replay a packet capture?
        options:
          - To confirm the detection is reproducible
          - To make the network faster
          - To change the firewall
          - To resolve DNS
        answer: 0
        explanation: "A reproducible alert is evidence. A one-off alert may be noise."
      - id: q5
        prompt: What does a successful ping prove?
        options:
          - Basic reachability for that packet size, not that the application works
          - The application is healthy
          - The route is symmetric
          - The firewall allows every port
        answer: 0
        explanation: "Small packets can pass while large ones fail, and the return path may differ."
      - id: q6
        prompt: What is an MTU black hole?
        options:
          - Large packets are dropped while small packets pass
          - DNS stops resolving
          - The router reboots
          - OSPF advertises a bad route
        answer: 0
        explanation: "The test is a large packet with the do-not-fragment flag, not another small ping."
      - id: q7
        prompt: Why is one-way loss hard to diagnose?
        options:
          - The forward and return paths can differ, so one side may show no loss
          - Ping cannot measure loss
          - Routers do not count packets
          - DNS hides it
        answer: 0
        explanation: "Check interface statistics and captures on both sides."
  - kind: scenario
    title: The one-way slowdown
    prompt: |
      Users in Pilbara say the intranet is slow. Ping succeeds. Small pages
      load. Large downloads stall. DNS feels slow. The link is a satellite
      with high latency. A colleague wants to reboot the router and add a
      static route. Choose your next move.
    options:
      - id: diagnose
        label: Test latency, loss, MTU, DNS and path separately, and compare with the baseline
        outcome: |
          The tests show satellite latency, a slow uncached DNS path because
          Pilbara has no resolver, and an MTU black hole on large packets.
          The evidence names three causes, not one vague slowdown.
        effects:
          Diagnosis: Specific
          Evidence: Separated
          Fix: Targeted
        recommended: true
        feedback: Most WAN faults look like "slow". Separate reachability, latency, loss, path, DNS, MTU and throughput.
      - id: reboot
        label: Reboot the router and see whether it comes back
        outcome: |
          The router returns. The latency, DNS path and MTU problem are
          unchanged. The outage added another variable to the investigation.
        effects:
          Action: Unsupported
          Evidence: Disturbed
          Fault: Unchanged
        feedback: A reboot is not a diagnosis. Test before you change the state.
      - id: route
        label: Add a static route to make the path shorter
        outcome: |
          The route does not change the satellite distance. It may create a
          loop or bypass the intended policy.
        effects:
          Risk: Higher
          Diagnosis: Worse
          Fault: Unchanged
        feedback: The path is already known. The problem is the link and the packet size, not a missing route.
      - id: bandwidth
        label: Assume it is a bandwidth cap and request a bigger link
        outcome: |
          The link may be capped, but the stalled large downloads and slow
          DNS remain unexplained. The organisation pays for capacity without
          fixing the black hole.
        effects:
          Cost: Increased
          Diagnosis: Incomplete
          Fault: Partly hidden
        feedback: A bandwidth cap is one of seven faults. Test for it rather than assuming it.
    debrief: |
      Turn "slow" into specific claims. Test each dimension, capture the
      evidence and compare with the baseline before changing the network.
