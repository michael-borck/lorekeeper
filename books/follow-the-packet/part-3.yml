# Interactive lessons appended to Part 3 of Follow the Packet.
lessons:
  - kind: checkpoint
    title: "Checkpoint: rebuild and prove"
    questions:
      - id: q1
        prompt: What can a packet capture not show?
        options:
          - Hosts that never transmitted, dropped traffic, and internal configuration
          - Source and destination addresses
          - DNS names
          - Service banners
        answer: 0
        explanation: "A capture is evidence of traffic, not a complete description of the network."
      - id: q2
        prompt: What should a reconstruction separate?
        options:
          - Observed facts from inferred topology, with confidence
          - Fast packets from slow packets
          - DNS from HTTP
          - Routers from switches
        answer: 0
        explanation: "The assumptions are the useful part of the report."
      - id: q3
        prompt: What is a baseline?
        options:
          - A profile of normal traffic by site, hour and service
          - A single average for the whole network
          - The firewall default policy
          - The routing table
        answer: 0
        explanation: "Normal is site-specific and time-specific. An average hides the rhythm."
      - id: q4
        prompt: What makes a behavioural anomaly different from a signature alert?
        options:
          - The packets may be ordinary; the time and pattern are wrong
          - It always uses malware
          - It only happens at night
          - It never produces false positives
        answer: 0
        explanation: "Behavioural detection compares the pattern with the baseline, not just a payload."
      - id: q5
        prompt: What should you do before calling a deviation an attack?
        options:
          - Name benign explanations and check the evidence
          - Escalate immediately
          - Reboot the network
          - Change the firewall
        answer: 0
        explanation: "A late backup, a time-zone change or a software update can look like an anomaly."
      - id: q6
        prompt: What makes a reconstruction useful to a reader?
        options:
          - Clear evidence, assumptions, confidence and tests
          - A complete-looking diagram with no gaps
          - A list of every packet
          - A vendor product name
        answer: 0
        explanation: "A report that names its gaps tells the reader what to verify."
      - id: q7
        prompt: What does a detection need beyond a threshold?
        options:
          - A response and an owner
          - A longer rule
          - A bigger baseline
          - A faster link
        answer: 0
        explanation: "A detection without a response is a dashboard."
